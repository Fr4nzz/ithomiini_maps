name: Manuscript evidence preparation
on:
  push:
    branches: [manuscript/final-gpt6-20260921]
    paths: [.github/workflows/manuscript-evidence-temporary.yml]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript/final-gpt6-20260921
          fetch-depth: 0
      - name: Prepare browser
        run: |
          python -m pip install --quiet playwright requests
          python -m playwright install --with-deps chromium
      - name: Capture real manuscript figures
        run: python paper/capture_interfaces_20260921.py
      - name: Check Gallery release tests and missing bibliography metadata
        shell: bash
        run: |
          mkdir -p /tmp/final-verification/references
          git clone --depth=1 https://github.com/rapidspeciation/Shiny_Ikiam_Wings_Gallery.git /tmp/gallery
          (cd /tmp/gallery; node --test tests/*.test.mjs) > /tmp/final-verification/gallery-tests.txt 2>&1
          (cd /tmp/gallery; node scripts/validate-curation-data.mjs) > /tmp/final-verification/gallery-curation-validation.txt 2>&1
          python - <<'PY'
          import requests,pathlib,json
          out=pathlib.Path('/tmp/final-verification/references')
          for doi in ['10.1111/j.1096-0031.2006.00108.x','10.1590/S0034-71081999000300010','10.1016/j.tree.2011.09.007']:
              r=requests.get('https://api.crossref.org/works/'+doi,timeout=60)
              if r.ok:(out/(doi.replace('/','_')+'.json')).write_text(json.dumps(r.json()['message'],indent=2))
          PY
      - name: Commit only paper figure outputs
        run: |
          test "$GITHUB_REF_NAME" = manuscript/final-gpt6-20260921
          git config user.name 'Franz Chandi'
          git config user.email 'fchandi@estud.usfq.edu.ec'
          git add paper/figures
          git diff --cached --check
          git commit -m 'Add actual Atlas and Identifier interface figures with capture receipt'
          git push origin HEAD:manuscript/final-gpt6-20260921
          git rev-parse HEAD > /tmp/final-verification/figure-commit.txt
      - name: Package evidence
        if: always()
        run: |
          mkdir -p /tmp/final-verification
          cp -r paper/figures /tmp/final-verification/
          cp paper/capture_interfaces_20260921.py /tmp/final-verification/
          cd /tmp/final-verification
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          tar -czf /tmp/final-verification.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-verification
          path: /tmp/final-verification.tar.gz
          retention-days: 7
