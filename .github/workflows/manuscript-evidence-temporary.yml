name: Manuscript evidence preparation
on:
  push:
    branches: [manuscript/final-gpt6-20260921]
    paths: [.github/workflows/manuscript-evidence-temporary.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare verification tools
        run: |
          python -m pip install --quiet torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet ultralytics==8.4.72 playwright requests
          python -m playwright install --with-deps chromium
      - name: Read artifacts and historical state
        shell: bash
        run: |
          mkdir -p /tmp/manuscript-verification
          python - <<'PY'
          import pathlib,json,subprocess,urllib.request,urllib.parse,hashlib,torch,collections,requests
          from ultralytics import YOLO
          out=pathlib.Path('/tmp/manuscript-verification')
          def get(url,path):
              try:
                  with urllib.request.urlopen(url,timeout=120) as r: b=r.read()
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(b)
                  return b
              except Exception as e:
                  (out/'errors.txt').open('a').write(url+' '+str(e)+'\n');return None
          model='https://huggingface.co/fr4nzzch/butterfly-id-classifier/resolve/61c8fb58578a2ea64c6972e17b5101697729eaa8/'
          for name in ['head_hier.pt','wing_seg.pt']:
              p=out/name; get(model+name,p)
              if p.exists(): (out/(name+'.sha256')).write_text(hashlib.sha256(p.read_bytes()).hexdigest())
          def compact(v):
              if isinstance(v,torch.Tensor): return {'shape':list(v.shape),'dtype':str(v.dtype)}
              if isinstance(v,dict): return {str(k):compact(x) for k,x in v.items()}
              if isinstance(v,(list,tuple)): return [compact(x) for x in v]
              if isinstance(v,(int,float,str,bool)) or v is None:return v
              return str(v)
          try:
              ck=torch.load(out/'head_hier.pt',map_location='cpu',weights_only=True)
              (out/'head_checkpoint_metadata.json').write_text(json.dumps(compact(ck),indent=2))
              counts={k:len(v) for k,v in ck.get('rank_vocab',{}).items()}
              print('HEAD',list(ck),len(ck['leaves']),counts,ck.get('K'),ck.get('feat_dim'))
          except Exception as e:(out/'head-error.txt').write_text(str(e))
          try:
              y=YOLO(str(out/'wing_seg.pt'))
              ck=y.ckpt
              data={k:compact(v) for k,v in ck.items() if k not in ['model','ema','optimizer','scaler','train_results']}
              data['model_yaml']=y.model.yaml;data['model_type']=str(type(y.model));data['model_names']=y.names
              data['model_modules']=[str(type(m)) for m in y.model.model]
              (out/'segmenter_checkpoint_metadata.json').write_text(json.dumps(data,indent=2,default=str))
          except Exception as e:(out/'segmenter-error.txt').write_text(str(e))
          refs=['1cdde9bc8d5f4375def888b5796e71493ee60d68','457a2170e60b6ad207a2c94a6440212da7525f18','83ff94499ec0283962366bf75fe4ca14441ded05','935cc42740aefbe70640eb15d79bf4f6c21e1089']
          for ref in refs:
              d=out/'sdm-history'/ref;d.mkdir(parents=True)
              for cmd,name in [(['git','show','--stat',ref],'commit-stat.txt'),(['git','show',ref+':public/data/sdm/sdm_metadata.json'],'sdm_metadata.json'),(['git','ls-tree','-r',ref,'public/data/sdm/species'],'file-tree.txt')]:
                  r=subprocess.run(cmd,capture_output=True,text=True);(d/name).write_text(r.stdout+r.stderr)
          (out/'sdm-metadata-history.txt').write_text(subprocess.check_output(['git','log','--all','--date=iso-strict','--format=%H %ad %s','--','public/data/sdm/sdm_metadata.json'],text=True))
          (out/'sdm-split-commit.patch').write_text(subprocess.check_output(['git','show','1cdde9bc8d5f4375def888b5796e71493ee60d68','--','sdm','public/data/sdm/sdm_metadata.json'],text=True))
          urls={
            'atlas_manifest.json':'https://rapidspeciation.github.io/ithomiini_maps/data/data_manifest.json',
            'atlas_sdm_metadata.json':'https://rapidspeciation.github.io/ithomiini_maps/data/sdm/sdm_metadata.json',
            'space_runtime_metadata.json':'https://fr4nzzch-butterfly-id.hf.space/metadata',
            'space_health.json':'https://fr4nzzch-butterfly-id.hf.space/health',
            'gallery_coverage_receipt.json':'https://rapidspeciation.github.io/Shiny_Ikiam_Wings_Gallery/data/prediction_coverage_receipt.json',
            'bioclip_README.md':'https://huggingface.co/imageomics/bioclip-2.5-vith14/raw/6e3d04e3d6522012c88181085c5ae666e14c45cd/README.md'}
          for name,url in urls.items():get(url,out/'deployed'/name)
          for slug in ['Napeogenes_peridia','Heliconius_erato','Mcclungia_cymo']:
              url=f'https://rapidspeciation.github.io/ithomiini_maps/data/sdm/species/{slug}_ensemble.tif'
              try:
                  r=requests.get(url,timeout=90);(out/'sdm-http.txt').open('a').write(f'{url} {r.status_code} {len(r.content)}\n')
              except Exception as e:(out/'sdm-http.txt').open('a').write(str(e)+'\n')
          queries=['McClure 2019 Ithomiini butterflies mimicry','Gauthier 2023 Ithomiini chromosomes','van der Heijden 2025 Ithomiini butterflies','Ben Chehida 2026 Ithomiini mimicry','BioCLIP 2 Emergent Properties Scaling Hierarchical Contrastive Learning','SAM 3 segment anything concepts','Rosser Mallet 2024 interactive maps heliconius','Into the Andes multiple independent colonizations Godyridina Chazot']
          for i,q in enumerate(queries):
              get('https://api.crossref.org/works?rows=5&query.bibliographic='+urllib.parse.quote(q),out/'references'/f'query_{i}.json')
          (out/'references/queries.json').write_text(json.dumps(queries,indent=2))
          PY
      - name: Capture actual deployed interfaces
        continue-on-error: true
        run: |
          python - <<'PY'
          import pathlib,json,time
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('/tmp/manuscript-verification/interfaces');out.mkdir()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--enable-webgl','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              context=browser.new_context(viewport={'width':1600,'height':1000},device_scale_factor=1)
              for name,url in [('atlas','https://rapidspeciation.github.io/ithomiini_maps/'),('gallery','https://rapidspeciation.github.io/Shiny_Ikiam_Wings_Gallery/')]:
                  page=context.new_page(); errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                  try:
                      page.goto(url,wait_until='domcontentloaded',timeout=120000);page.wait_for_timeout(30000)
                      page.screenshot(path=str(out/(name+'.png')),full_page=False)
                      (out/(name+'.html')).write_text(page.content())
                      (out/(name+'.txt')).write_text(page.locator('body').inner_text())
                      (out/(name+'-controls.json')).write_text(json.dumps(page.locator('button,select,input,a').evaluate_all('(els)=>els.map(e=>({tag:e.tagName,text:e.innerText,placeholder:e.placeholder,aria:e.getAttribute("aria-label"),href:e.getAttribute("href")}))'),indent=2))
                      if name=='gallery':
                          candidate=page.get_by_text('AI Identifier',exact=True)
                          if candidate.count():
                              candidate.first.click();page.wait_for_timeout(12000);page.screenshot(path=str(out/'ai-identifier.png'));(out/'ai-identifier.txt').write_text(page.locator('body').inner_text())
                  except Exception as e:errors.append(str(e))
                  (out/(name+'-errors.json')).write_text(json.dumps(errors,indent=2));page.close()
              browser.close()
          PY
      - name: Package verification
        if: always()
        run: |
          cd /tmp/manuscript-verification
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          tar -czf /tmp/manuscript-verification.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manuscript-verification
          path: /tmp/manuscript-verification.tar.gz
          retention-days: 7
