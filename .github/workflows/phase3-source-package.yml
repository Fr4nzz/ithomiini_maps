name: Phase 3 manuscript source package
on:
  push:
    branches: [manuscript/submission-ready-20260922]
    paths: [.github/workflows/phase3-source-package.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b2fee94d15c891952494f4a9074576febc12a00
          fetch-depth: 1
          persist-credentials: false
      - name: Package manuscript and method sources only
        shell: bash
        run: |
          mkdir -p phase3-source
          git ls-tree -r HEAD > phase3-source/repository-tree.txt
          git rev-parse HEAD > phase3-source/source-commit.txt
          python - <<'PY'
          from pathlib import Path
          import shutil
          roots = ['paper', 'sdm', 'scripts', 'docs', '.agents/skills/personal-writing-style']
          allowed = {'.md', '.py', '.json', '.yaml', '.yml', '.txt', '.gs', '.js', '.mjs', '.r', '.svg', '.png', '.jpg', '.jpeg'}
          for root in roots:
              for p in Path(root).rglob('*'):
                  if p.is_file() and p.suffix.lower() in allowed and p.stat().st_size < 30000000:
                      q = Path('phase3-source') / p
                      q.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(p, q)
          for filename in ['public/data/data_manifest.json', 'public/data/sdm/sdm_metadata.json', 'package.json', 'LICENSE', 'README.md']:
              p = Path(filename)
              if p.is_file():
                  q = Path('phase3-source') / p
                  q.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, q)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-phase3-source
          path: phase3-source/
          include-hidden-files: true
          retention-days: 3
