name: Finalize Phase 3 manuscript
on:
  push:
    branches: [manuscript/submission-ready-20260922]
    paths: [.github/workflows/phase3-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 3b2fee94d15c891952494f4a9074576febc12a00
      BRANCH: manuscript/submission-ready-20260922
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify branch and materialise the reviewed manuscript package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BASE"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma
          b=b''.join(Path(f'.github/phase3-transfer/bundle.part{i}').read_bytes() for i in range(1,6))
          assert hashlib.sha256(b).hexdigest()=='9e15d5176a79d3b7c83211330ebf3b424fa83060cc27da846b5506289ab437ff'
          files=json.loads(lzma.decompress(b))
          expected={'paper/figures/README.md','paper/figures/figure1_workflow.svg','paper/figures/make_figure1.py','paper/manuscript.md','paper/phase3_author_actions_20260922.md','paper/phase3_layout_validation_20260922.json','paper/phase3_method_checks_20260922.md','paper/phase3_reference_audit_20260922.md','paper/phase3_reference_records_20260922.json','paper/phase3_source_receipts_20260922.json','paper/phase3_validation_20260922.json','paper/supplementary_protocol_S1.md','paper/tools/check_reading_layout.py','paper/tools/reading.css','paper/tools/render_reading_copies.py','paper/tools/validate_submission.py'}
          assert set(files)==expected
          for name,content in files.items():
              p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='paper'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf-8')
          expected_hashes={'paper/manuscript.md':'d6435bc526a950454e05bc0de97ce66b14ca7e3fd4e9b5814731aa258472e724','paper/final_manuscript_evidence_20260921.md':'5bb2a81578be968a67d3d9f7dfd9acf7916111b93280c0693ed3ac745d603043','paper/phase2_revision_handoff_20260921.md':'b7491f85315a61a31735112eae5e4dce2da58c485a0db46ef1ed3cb640aaff4d'}
          for name,want in expected_hashes.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==want,name
          print('All 16 transferred text files and protected-source hashes verified.')
          PY
      - name: Install the documented rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4 cairosvg
          curl --fail --location --silent --show-error --retry 2 https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/pandoc.tar.gz"
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.1.11.1/bin" >> "$GITHUB_PATH"
      - name: Generate figure preview and standalone HTML, then validate
        shell: bash
        run: |
          set -euo pipefail
          pandoc --version | head -1
          python paper/figures/make_figure1.py --png
          python paper/tools/render_reading_copies.py
          python paper/tools/validate_submission.py --output paper/phase3_validation_20260922.json
          python - <<'PY'
          from pathlib import Path
          import datetime,json,urllib.request
          url='https://fr4nzz.github.io/rename_photos_AI/'
          receipt={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requested_url':url,'scope':'HTTP availability only, not interactive function testing'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Ithomiini manuscript submission audit'}),timeout=30) as r:
                  receipt.update(status=r.status,resolved_url=r.url)
          except Exception as e:receipt['error']=str(e)
          Path('paper/phase3_public_endpoint_check_20260922.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - name: Remove temporary helpers and commit only manuscript deliverables
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/phase3-transfer
          rm .github/workflows/phase3-source-package.yml .github/workflows/phase3-reference-check.yml .github/workflows/phase3-primary-records.yml .github/workflows/phase3-finalize.yml
          git add paper .github/phase3-transfer .github/workflows/phase3-source-package.yml .github/workflows/phase3-reference-check.yml .github/workflows/phase3-primary-records.yml .github/workflows/phase3-finalize.yml
          git diff --cached --check
          git diff --check "$BASE"
          python - <<'PY'
          import os,subprocess
          changed=subprocess.check_output(['git','diff','--cached','--name-only',os.environ['BASE']],text=True).splitlines()
          assert changed and all(p.startswith('paper/') for p in changed),changed
          for name in ['paper/final_manuscript_evidence_20260921.md','paper/phase2_revision_handoff_20260921.md']:
              assert name not in changed,name
          print('\n'.join(changed))
          PY
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize submission-ready Ithomiini manuscript'
          git push origin "HEAD:refs/heads/$BRANCH"
          mkdir -p phase3-final-result
          git rev-parse HEAD > phase3-final-result/final-commit.txt
          git diff --stat "$BASE" HEAD > phase3-final-result/change-summary.txt
          git diff --check "$BASE" HEAD
          git status --porcelain --untracked-files=no > phase3-final-result/tracked-worktree-status.txt
          cp -R paper phase3-final-result/paper
      - uses: actions/upload-artifact@v4
        with:
          name: ithomiini-phase3-final-result
          path: phase3-final-result/
          retention-days: 7
