name: Phase 3 primary records
on:
  push:
    branches: [manuscript/submission-ready-20260922]
    paths: [.github/workflows/phase3-primary-records.yml]
permissions:
  contents: read
jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b2fee94d15c891952494f4a9074576febc12a00
          persist-credentials: false
      - name: Collect primary reference records at a conservative request rate
        run: |
          python - <<'PY'
          import json, re, time, urllib.request, urllib.parse
          from pathlib import Path
          out=Path('primary-records'); out.mkdir()
          def get(url):
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'ManuscriptReferenceAudit/1.0','Accept':'application/json, text/html, text/plain, */*'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          b=r.read(5000000)
                          try: data=json.loads(b)
                          except Exception: data=b.decode('utf-8',errors='replace')
                          return {'requested_url':url,'resolved_url':r.url,'status':r.status,'data':data}
                  except Exception as e:
                      error=str(e)
                      if '429' not in error: break
                      time.sleep(6*(attempt+1))
              return {'requested_url':url,'error':error}
          dois=set(re.findall(r'10\.\d{4,9}/[A-Za-z0-9._/()-]+',Path('paper/manuscript.md').read_text()))
          dois={d.rstrip(').') for d in dois if not d.startswith(('10.15468','10.48550'))}
          dois.update(['10.1111/mec.13773','10.1111/j.1096-0031.2006.00108.x','10.1371/journal.pbio.0060300','10.1371/journal.pbio.1002415','10.1002/joc.5086','10.1023/A:1010933404324','10.1145/2939672.2939785','10.1590/S0034-71081999000300010','10.1186/s12862-016-0701-5','10.52202/085713-3436'])
          jobs={f'crossref_{i}':'https://api.crossref.org/works/'+urllib.parse.quote(d,safe='') for i,d in enumerate(sorted(dois))}
          jobs.update({
           'gbif_handle':'https://hdl.handle.net/api/handles/10.15468/dl.6zagkz',
           'gbif_resolver':'https://doi.org/10.15468/dl.6zagkz',
           'bioclip_model_doi':'https://api.datacite.org/dois/10.57967/hf/10131',
           'bioclip_proceedings':'https://proceedings.neurips.cc/paper_files/paper/2025/hash/94da80cbfe870c1db958c88a8a27018c-Abstract-Conference.html',
           'hf_source':'https://huggingface.co/spaces/fr4nzzch/butterfly-id/raw/3aa72a33946f2da661d1ed96f0929e92cd9413e6/inference.py',
           'hf_old_source':'https://huggingface.co/spaces/fr4nzzch/butterfly-id/raw/3aa72a36c37ce8b383f8f5a5f9ec5763f52e5e42/inference.py',
           'gallery_app':'https://raw.githubusercontent.com/rapidspeciation/Shiny_Ikiam_Wings_Gallery/f5cb03f17f3ba639090b32fbedde6d6645ff847b/src/App.vue',
           'gallery_indexer':'https://raw.githubusercontent.com/rapidspeciation/Shiny_Ikiam_Wings_Gallery/f5cb03f17f3ba639090b32fbedde6d6645ff847b/list_google_drive_files.gs',
           'gallery_process':'https://raw.githubusercontent.com/rapidspeciation/Shiny_Ikiam_Wings_Gallery/f5cb03f17f3ba639090b32fbedde6d6645ff847b/scripts/process_data.py',
           'gallery_update':'https://raw.githubusercontent.com/rapidspeciation/Shiny_Ikiam_Wings_Gallery/f5cb03f17f3ba639090b32fbedde6d6645ff847b/.github/workflows/update_data.yml',
           'processor_tree':'https://api.github.com/repos/Fr4nzz/rename_photos_AI/git/trees/49fe6ed226ed4914ed793e4252b74e18cf6ad8a4?recursive=1',
           'vue':'https://vuejs.org/guide/introduction.html',
           'maplibre':'https://maplibre.org/maplibre-gl-js/docs/',
           'python':'https://docs.python.org/3/reference/index.html',
           'github_actions':'https://docs.github.com/en/actions',
           'github_pages':'https://docs.github.com/en/pages',
           'dbscan':'https://aaai.org/papers/kdd96-037-a-density-based-algorithm-for-discovering-clusters-in-large-spatial-databases-with-noise/',
           'nymphalidae':'https://www.nymphalidae.net/Classification.html'
          })
          for k,url in jobs.items():
              d=get(url); (out/(k+'.json')).write_text(json.dumps(d,ensure_ascii=False,indent=2))
              print(k,d.get('status',d.get('error')))
              time.sleep(1.5)
          (out/'request_index.json').write_text(json.dumps(jobs,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-primary-records
          path: primary-records/
          retention-days: 3
