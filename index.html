<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Wings Atlas | Interactive Butterfly Research Tool</title>
    <meta name="title" content="Wings Atlas | Interactive Butterfly Research Tool" />
    <meta name="description" content="Interactive mapping tool for Neotropical butterfly research. Visualize specimen distributions, sequencing status, and mimicry patterns across South America." />
    <meta name="keywords" content="Ithomiini, butterflies, distribution maps, biodiversity, Nymphalidae, mimicry, South America, scientific research, Sanger Institute" />
    <meta name="author" content="Wellcome Sanger Institute - Dr. Joana Meier Lab" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fr4nzz.github.io/ithomiini_maps/" />
    <meta property="og:title" content="Wings Atlas" />
    <meta property="og:description" content="Interactive mapping tool for Neotropical butterfly research. Visualize specimen distributions, sequencing status, and mimicry patterns." />
    <meta property="og:image" content="https://fr4nzz.github.io/ithomiini_maps/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fr4nzz.github.io/ithomiini_maps/" />
    <meta property="twitter:title" content="Wings Atlas" />
    <meta property="twitter:description" content="Interactive mapping tool for Neotropical butterfly research. Visualize specimen distributions, sequencing status, and mimicry patterns." />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#1a1a2e" />
    <script>
      // Light or dark before the first paint, so a reload never flashes the wrong colour. src/stores/theme.js
      // keeps it right afterwards: keep the storage keys and page colours (themes/presets.js) in step with it.
      ;(function () {
        var page = {emerald:['#f8f9fa','#1a1a2e'],ocean:['#f0f7fa','#0d1b2a'],forest:['#f5f9f0','#1a2e1a'],sunset:['#fdf8f3','#2e1a1a'],lavender:['#faf8fc','#1f1a2e']}
        var get = function (key) { try { return localStorage.getItem(key) } catch (e) { return null } }
        var pref = get('atlas-theme-mode')
        if (!pref && get('app-persist-enabled') === 'true') pref = get('app-mode')
        var dark = pref === 'dark' || (pref !== 'light' && !!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        var palette = get('app-persist-enabled') === 'true' ? (get('app-theme') || '').replace(/"/g, '') : ''
        if (!page[palette]) palette = 'emerald'
        var mode = dark ? 'dark' : 'light', colour = page[palette][dark ? 1 : 0], root = document.documentElement
        root.setAttribute('data-theme', palette)
        root.setAttribute('data-mode', mode)
        root.className = 'theme-' + palette + ' ' + mode
        root.style.colorScheme = mode
        root.style.backgroundColor = colour
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colour)
      })()
    </script>

    <!-- Opt out of Chrome Topics/FLoC tracking (silences "browsing-topics" permissions warnings) -->
    <meta http-equiv="Permissions-Policy" content="browsing-topics=(), interest-cohort=()" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://wsrv.nl" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
