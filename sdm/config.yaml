# ══════════════════════════════════════════════════════════════════════════════
# SDM Pipeline Configuration
# ══════════════════════════════════════════════════════════════════════════════

# Paths (relative to sdm/ directory)
paths:
  occurrence_data: ../public/data/
  env_variables: data/env_variables/
  host_plants: data/host_plants/
  occurrences: data/occurrences/
  predictions: data/predictions/
  figures: data/figures/

# Study area (Neotropics bounding box)
study_area:
  west: -120.0
  east: -30.0
  south: -40.0
  north: 25.0

# Environmental variables
env_data:
  # CHELSA v2.1 bioclimatic variables (1981-2010 baseline)
  # https://chelsa-climate.org/bioclim/
  chelsa:
    base_url: "https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio/"
    resolution: "30arcsec"  # ~1km
    # Selected bioclimatic variables (reduced from 19 to avoid multicollinearity)
    # BIO1  = Annual Mean Temperature
    # BIO2  = Mean Diurnal Range
    # BIO4  = Temperature Seasonality
    # BIO5  = Max Temperature of Warmest Month
    # BIO6  = Min Temperature of Coldest Month
    # BIO12 = Annual Precipitation
    # BIO13 = Precipitation of Wettest Month
    # BIO14 = Precipitation of Driest Month
    # BIO15 = Precipitation Seasonality
    variables:
      - CHELSA_bio1_1981-2010_V.2.1.tif
      - CHELSA_bio2_1981-2010_V.2.1.tif
      - CHELSA_bio4_1981-2010_V.2.1.tif
      - CHELSA_bio5_1981-2010_V.2.1.tif
      - CHELSA_bio6_1981-2010_V.2.1.tif
      - CHELSA_bio12_1981-2010_V.2.1.tif
      - CHELSA_bio13_1981-2010_V.2.1.tif
      - CHELSA_bio14_1981-2010_V.2.1.tif
      - CHELSA_bio15_1981-2010_V.2.1.tif

  # Elevation (Copernicus DEM resampled to ~1km)
  elevation:
    source: "srtm"  # Will use SRTM 90m aggregated to ~1km
    url: "https://srtm.csi.cgiar.org/wp-content/uploads/files/srtm_5x5/TIFF/"

  # EarthEnv cloud cover (mean annual cloud frequency at 1km)
  cloud_cover:
    url: "https://data.earthenv.org/cloud/MODCF_meanannual.tif"

# SDM modelling parameters
modelling:
  # Minimum records per species to attempt SDM
  min_records: 20

  # Spatial thinning distance (km) — reduces sampling bias
  thinning_distance_km: 5

  # Number of pseudo-absences (background points)
  n_background: 10000

  # Background sampling strategy: "target_group" or "random"
  background_strategy: "target_group"

  # Buffer around occurrences for defining accessible area (degrees)
  accessible_area_buffer: 5.0

  # Cross-validation
  cv_folds: 5
  cv_strategy: "spatial"  # "spatial" (blockCV-style) or "random"

  # Algorithms to include in ensemble
  algorithms:
    - maxent          # MaxEnt via elapid
    - random_forest   # scikit-learn RandomForest
    - gbm             # XGBoost gradient boosted machines

  # Ensemble method: "weighted_mean" (by AUC) or "mean" or "median"
  ensemble_method: "weighted_mean"

  # Resolution for prediction grid (degrees)
  prediction_resolution: 0.1  # ~11km at equator — good balance of detail vs speed

  # Evaluation metrics to compute
  metrics:
    - auc
    - tss

# Species selection
species:
  # "all" = model all species with >= min_records
  # "top_N" = model top N species by record count
  # list of names = model specific species
  selection: "all"

  # For proof-of-concept, start with these well-recorded species
  proof_of_concept:
    - "Mechanitis polymnia"
    - "Mechanitis messenoides"
    - "Hypothyris euclea"
    - "Tithorea harmonia"
    - "Dircenna dero"

# Output
output:
  # Generate PMTiles for web visualization
  pmtiles: true
  # Generate GeoTIFF per species
  geotiff: true
  # Generate species richness map
  richness_map: true
  # Threshold for binary presence/absence maps
  threshold: 0.5
