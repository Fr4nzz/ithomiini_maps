# ══════════════════════════════════════════════════════════════════════════════
# SDM Pipeline Configuration
# ══════════════════════════════════════════════════════════════════════════════

# Paths (relative to sdm/ directory)
paths:
  occurrence_data: ../public/data/
  env_variables: data/env_variables/
  host_plants: data/host_plants/
  occurrences: data/occurrences/
  predictions: data/predictions/
  figures: data/figures/

# Study area (Neotropics bounding box)
study_area:
  west: -120.0
  east: -30.0
  south: -40.0
  north: 25.0

# Environmental variables
env_data:
  # CHELSA v2.1 bioclimatic variables (1981-2010 baseline)
  chelsa:
    base_url: "https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio/"
    resolution: "30arcsec"  # ~1km
    variables:
      - CHELSA_bio1_1981-2010_V.2.1.tif
      - CHELSA_bio2_1981-2010_V.2.1.tif
      - CHELSA_bio4_1981-2010_V.2.1.tif
      - CHELSA_bio5_1981-2010_V.2.1.tif
      - CHELSA_bio6_1981-2010_V.2.1.tif
      - CHELSA_bio12_1981-2010_V.2.1.tif
      - CHELSA_bio13_1981-2010_V.2.1.tif
      - CHELSA_bio14_1981-2010_V.2.1.tif
      - CHELSA_bio15_1981-2010_V.2.1.tif

  elevation:
    source: "srtm"
    url: "https://srtm.csi.cgiar.org/wp-content/uploads/files/srtm_5x5/TIFF/"

  cloud_cover:
    url: "https://data.earthenv.org/cloud/MODCF_meanannual.tif"

  # File patterns to EXCLUDE from env layers (e.g. host plant rasters)
  # These are in the cropped/ dir but should not be used as predictors
  exclude_patterns:
    - "host_*"

# SDM modelling parameters
modelling:
  min_records: 20
  thinning_distance_km: 5
  n_background: 10000
  background_strategy: "target_group"
  accessible_area_buffer: 5.0

  # Accessible-area construction (Barve et al. 2011).
  # "single_hull"     = legacy: one buffered convex hull around all records.
  # "dbscan_clusters" = cluster spatially disjunct populations with DBSCAN,
  #                     buffer each cluster's hull, union the result.
  accessible_area_strategy: "dbscan_clusters"
  dbscan_eps_km: 500              # DBSCAN distance threshold in km
  dbscan_min_samples: 3           # min points to form a cluster

  # Buffer width per cluster.
  # "fixed"        = constant buffer_fixed_km (or accessible_area_buffer above).
  # "range_scaled" = buffer_fraction_of_diameter * cluster_diameter_km,
  #                  clipped to [buffer_min_km, buffer_max_km].
  buffer_strategy: "range_scaled"
  buffer_fixed_km: 555            # ~ 5 deg, equivalent to legacy buffer
  buffer_fraction_of_diameter: 0.25
  buffer_min_km: 50
  buffer_max_km: 500

  # Background sample size.
  # "fixed"         = always n_background, regardless of accessible-area size.
  # "density_based" = density_per_km2 * accessible_area_km2,
  #                   clipped to [background_floor, background_ceiling].
  n_background_strategy: "density_based"
  background_density_per_km2: 0.0005    # ≈ 10000 pts across Neotropics
  background_floor: 2000
  background_ceiling: 15000

  # Bias correction
  use_bias_raster: true  # Weight background by KDE of all Ithomiini records
  bias_bandwidth: 1.0    # KDE bandwidth in degrees (~111km)

  # Variable selection
  vif_threshold: 10.0    # Remove variables with VIF > this (0 = no filtering)

  # Cross-validation
  cv_folds: 5
  cv_strategy: "spatial"

  # Algorithms
  algorithms:
    - maxent
    - random_forest
    - gbm

  ensemble_method: "weighted_mean"
  prediction_resolution: 0.1

  # Evaluation metrics
  metrics:
    - auc
    - tss
    - boyce   # Continuous Boyce index (presence-only metric)

  # MESS maps (Multivariate Environmental Similarity Surfaces)
  generate_mess: true

# Species selection
species:
  selection: "all"
  proof_of_concept:
    - "Mechanitis polymnia"
    - "Mechanitis messenoides"
    - "Hypothyris euclea"
    - "Tithorea harmonia"
    - "Dircenna dero"

# Output
output:
  pmtiles: true
  geotiff: true
  richness_map: true
  threshold: 0.5
