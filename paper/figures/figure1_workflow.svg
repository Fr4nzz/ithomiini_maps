<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="194.25mm" viewBox="0 0 1440 1554" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Specimen digitisation, separate taxonomic classifiers and Wings Atlas</title>
<desc id="figure-desc">A: visible specimen identifiers are read, reviewed by a person, renamed by wing surface and indexed in shared storage. B: reviewed collection photographs support specimen-linked browsing and taxonomic review in Wings Gallery. C: one uploaded photograph is localised and cropped, encoded with frozen BioCLIP 2.5-H and classified by a supervised taxonomic classifier. Optional geography follows classification. D: verified dorsal and ventral views form a 2,048-dimensional representation for a distinct fitted collection classifier and precomputed predictions. E: butterfly occurrence records and annotations, independent plant occurrences and modelled relative habitat suitability are distinct Wings Atlas inputs. F: occurrence, SDM and classifier releases are versioned separately. No collection accuracy is attributed to uploaded photographs.</desc>
